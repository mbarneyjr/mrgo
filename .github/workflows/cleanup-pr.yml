name: cleanup-pr
run-name: 'cleanup-pr: ${{ github.event.pull_request.title }}'

on:
  pull_request:
    branches:
      - '*'
    types:
      - closed

permissions:
  id-token: write
  contents: write
  packages: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency: cleanup-${{ github.event.pull_request.number }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::533267179197:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: cleanup
        # shell: nix prelop --command bash -e {0}
        run: |
          ENVIRONMENT_NAME="pr${{ github.event.pull_request.number }}"
          source ./scripts/utils/load-config.sh "${ENVIRONMENT_NAME}"
          # ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" frontend
          ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" api
          ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" database
          # ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" auth
