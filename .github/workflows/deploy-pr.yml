name: deploy-pr
run-name: 'deploy-pr: ${{ github.event.pull_request.title }}'

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  id-token: write
  contents: write
  packages: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/utils/build.sh
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: result
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'ci:enabled')
    concurrency: deploy-${{ github.event.pull_request.number }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: result
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::533267179197:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: deploy
        # shell: nix prelop --command bash -e {0}
        env:
          SHARED_API: ${{ contains(github.event.pull_request.labels.*.name, 'ci:shared-api') }}
          SHARED_AUTH: ${{ contains(github.event.pull_request.labels.*.name, 'ci:shared-auth') }}
          SHARED_DATABASE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:shared-database') }}
        run: |
          ENVIRONMENT_NAME="pr${{ github.event.pull_request.number }}"
          source ./scripts/utils/load-shared-environment.sh dev
          source ./scripts/utils/load-config.sh "${ENVIRONMENT_NAME}"
          if [[ "${SHARED_DATABASE}" != "true" ]]; then
            ./scripts/utils/plan.sh "${ENVIRONMENT_NAME}" database
            ./scripts/utils/apply.sh "${ENVIRONMENT_NAME}" database
          fi
          # ./scripts/utils/plan.sh "${ENVIRONMENT_NAME}" auth
          # ./scripts/utils/apply.sh "${ENVIRONMENT_NAME}" auth
          ./scripts/utils/plan.sh "${ENVIRONMENT_NAME}" api
          ./scripts/utils/apply.sh "${ENVIRONMENT_NAME}" api
          # ./scripts/utils/plan.sh "${ENVIRONMENT_NAME}" frontend
          # ./scripts/utils/apply.sh "${ENVIRONMENT_NAME}" frontend
          echo "deployment successful. cleaning up any unnecessary resources:"
          # if [[ "${SHARED_API}" == "true" ]]; then
          #   ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" api
          # fi
          if [[ "${SHARED_DATABASE}" == "true" ]]; then
            ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" database
          fi
          # if [[ "${SHARED_AUTH}" == "true" ]]; then
          #   ./scripts/utils/delete.sh "${ENVIRONMENT_NAME}" auth
          # fi
