name: deploy-prod
run-name: 'deploy-prod: ${{ github.ref_name }}'

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write
  packages: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    concurrency: deploy-prod
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - id: get_workflow_run
        name: get workflow run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=${{ github.ref_name }}&head_sha=${{ github.sha }}&status=success" \
            | jq -r '.workflow_runs[0].id')
          if [[ -z "${WORKFLOW_RUN}" || "${WORKFLOW_RUN}" == "null" ]]; then
            echo "No successful workflow run found for branch ${{ github.ref_name }} and commit ${{ github.sha }}"
            exit 1
          fi
          echo "build_workflow_run=${WORKFLOW_RUN}" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get_workflow_run.outputs.build_workflow_run }}
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::533267179197:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: deploy
        # shell: nix develop --command bash -e {0}
        run: |
          source ./scripts/utils/load-config.sh prod
          ./scripts/utils/plan.sh prod database
          ./scripts/utils/apply.sh prod database
          ./scripts/utils/plan.sh prod api
          ./scripts/utils/apply.sh prod api
